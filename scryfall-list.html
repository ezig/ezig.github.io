<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scryfall Drag List</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel-2:#21252e; --line:#2e333f;
    --text:#e7e9ee; --muted:#9aa2b1; --accent:#f2a33c; --accent-2:#5aa9e6;
    --good:#4caf7d; --danger:#e06c6c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.2px}
  header .hint{color:var(--muted); font-size:12px}
  main{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0; min-height:0}
  @media (max-width:820px){ main{grid-template-columns:1fr} }

  #drop{
    position:relative; margin:14px; border:2px dashed var(--line); border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:10px; color:var(--muted);
    transition:border-color .12s, background .12s; min-height:180px;
  }
  #drop.hot{ border-color:var(--accent); background:rgba(242,163,60,.08); color:var(--text) }
  #drop .big{font-size:16px; color:var(--text); font-weight:600}
  #drop kbd{
    background:var(--panel-2); border:1px solid var(--line); border-bottom-width:2px;
    border-radius:5px; padding:1px 6px; font-size:12px; font-family:inherit;
  }
  #toast{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    background:var(--good); color:#062; font-weight:600; padding:6px 12px; border-radius:999px;
    font-size:12px; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap;
  }
  #toast.show{opacity:1}

  .col{display:flex; flex-direction:column; min-height:0; border-left:1px solid var(--line)}
  @media (max-width:820px){ .col{border-left:0; border-top:1px solid var(--line)} }
  .col > .bar{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .bar .count{font-weight:600}
  .bar .spacer{flex:1}
  button{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; font:inherit; font-size:13px; cursor:pointer;
  }
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--accent); color:#3a2500; border-color:transparent; font-weight:600}
  button.ghost-danger:hover{border-color:var(--danger); color:var(--danger)}
  label.opt{display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; cursor:pointer}

  #list{overflow:auto; padding:6px 8px; flex:1}
  .row{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px;
  }
  .row:hover{background:var(--panel)}
  .row .qty{
    min-width:26px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums;
    background:var(--panel-2); border-radius:5px; padding:1px 4px; font-size:12px;
  }
  .row .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .nm.pending{color:var(--muted); font-style:italic}
  .row .x{
    opacity:0; border:0; background:transparent; color:var(--muted); font-size:16px;
    line-height:1; padding:2px 6px; cursor:pointer; border-radius:5px;
  }
  .row:hover .x{opacity:1}
  .row .x:hover{color:var(--danger); background:var(--panel-2)}
  .empty{color:var(--muted); padding:18px; text-align:center; font-size:13px}

  #out{
    flex:1; margin:0; border:0; border-top:1px solid var(--line); resize:none;
    background:var(--panel); color:var(--text); padding:12px 14px;
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  #out:focus{outline:none}

  details.raw{border-top:1px solid var(--line); background:var(--panel)}
  details.raw summary{padding:8px 14px; cursor:pointer; color:var(--muted); font-size:12px}
  details.raw pre{
    margin:0; padding:0 14px 12px; max-height:220px; overflow:auto;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--muted);
    white-space:pre-wrap; word-break:break-all;
  }
  .warn{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Scryfall Drag List</h1>
  <span class="hint">Put this window and scryfall.com side by side, then drag card images across. The list is saved in browser local storage.</span>
</header>

<main>
  <div id="drop">
    <div class="big">Drop Scryfall cards here</div>
    <div>Drag a card image (or a card link) from a Scryfall tab onto this area.</div>
    <div id="toast"></div>
  </div>

  <div class="col">
    <div class="bar">
      <span class="count" id="count">0 cards</span>
      <span class="spacer"></span>
      <label class="opt"><input type="checkbox" id="optDedupe" checked> combine duplicates</label>
      <label class="opt"><input type="checkbox" id="optQty"> <code>Nx</code> prefix</label>
      <button id="copyBtn" class="primary">Copy</button>
      <button id="clearBtn" class="ghost-danger">Clear</button>
    </div>
    <div id="list"></div>
    <textarea id="out" readonly spellcheck="false" placeholder="Your list appears here…"></textarea>
    <details class="raw">
      <summary>Last drop payload</summary>
      <pre id="rawView">Nothing dropped yet.</pre>
    </details>
  </div>
</main>

<script>
(() => {
  "use strict";
  const KEY = "scryfall-cube-list-v1";
  const OPTS = "scryfall-cube-list-opts-v1";

  /** @type {{name:string,key:string,pending?:boolean}[]} entries in drag order */
  let items = load(KEY, []);
  let opts = load(OPTS, {dedupe:true, qty:false});

  const $ = s => document.querySelector(s);
  const dropEl = $("#drop"), listEl = $("#list"), outEl = $("#out"),
        countEl = $("#count"), rawEl = $("#rawView"), toastEl = $("#toast");
  const optDedupe = $("#optDedupe"), optQty = $("#optQty");

  optDedupe.checked = opts.dedupe;
  optQty.checked = opts.qty;
  optDedupe.onchange = () => { opts.dedupe = optDedupe.checked; save(OPTS,opts); render(); };
  optQty.onchange = () => { opts.qty = optQty.checked; save(OPTS,opts); render(); };
  $("#copyBtn").onclick = copyOut;
  $("#clearBtn").onclick = () => { if (items.length && confirm("Clear the whole list?")) { items = []; commit(); } };

  // ---- drag & drop ----
  ["dragenter","dragover"].forEach(ev =>
    dropEl.addEventListener(ev, e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; dropEl.classList.add("hot"); }));
  ["dragleave","dragend"].forEach(ev =>
    dropEl.addEventListener(ev, () => dropEl.classList.remove("hot")));
  // allow drop anywhere on the page, not just the box
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => e.preventDefault());

  dropEl.addEventListener("drop", e => {
    e.preventDefault();
    dropEl.classList.remove("hot");
    // Sweep the payload SYNCHRONOUSLY — dataTransfer is dead after the first await.
    const payload = {};
    for (const t of e.dataTransfer.types) {
      try { payload[t] = e.dataTransfer.getData(t); } catch { payload[t] = ""; }
    }
    rawEl.textContent = Object.keys(payload).length
      ? Object.entries(payload).map(([k,v]) => `[${k}]\n${v || "(empty)"}`).join("\n\n")
      : "(no data in drop)";
    handleDrop(payload);
  });

  async function handleDrop(payload) {
    const parsed = parsePayload(payload);
    if (!parsed) {
      toast("Couldn't read a card from that drop", true);
      rawEl.textContent = "⚠ No Scryfall card found in this payload.\n\n" + rawEl.textContent;
      $(".raw").open = true;
      return;
    }

    // Provisional entry (from alt text / slug); may be refined by an API lookup.
    const entry = { name: parsed.name || "(looking up…)", key: parsed.key, pending: !parsed.name };
    items.push(entry);
    commit();
    if (parsed.name) toast("Added " + parsed.name);

    if (!parsed.name || parsed.needsLookup) {
      const better = await lookup(parsed).catch(() => null);
      if (better) {
        entry.name = better;
        entry.key = normKey(better);
        entry.pending = false;
        commit();
        toast("Added " + better);
      } else if (entry.pending) {
        // lookup failed and we had nothing usable — drop it
        items = items.filter(x => x !== entry);
        commit();
        toast("Lookup failed for that card", true);
      }
    }
  }

  // ---- payload parsing ----
  function parsePayload(p) {
    const values = Object.values(p).filter(Boolean);
    const blob = values.join("\n");

    let name = "", nameFromAlt = false, set = "", number = "", uuid = "";

    // 1) text/html — best source: <img alt> / <img title> and the card <a href>
    const html = p["text/html"] || (blob.includes("<") ? blob : "");
    if (html) {
      try {
        const doc = new DOMParser().parseFromString(html, "text/html");
        const img = doc.querySelector("img");
        const raw = img && (img.getAttribute("alt") || img.getAttribute("title") || "");
        if (raw) { name = cleanName(raw); nameFromAlt = !!name; }
        const a = doc.querySelector('a[href*="scryfall.com/card/"]');
        const href = a && a.getAttribute("href");
        const m = href && href.match(/scryfall\.com\/card\/([a-z0-9]+)\/([^/?#\s"'<]+)/i);
        if (m) { set = decodeURIComponent(m[1]); number = decodeURIComponent(m[2]); }
      } catch {}
    }

    // 2) any card-page URL in the payload
    if (!set) {
      const m = blob.match(/scryfall\.com\/card\/([a-z0-9]+)\/([^/?#\s"'<]+)(?:\/([a-z0-9-]+))?/i);
      if (m) { set = decodeURIComponent(m[1]); number = decodeURIComponent(m[2]); if (!name && m[3]) name = prettySlug(m[3]); }
    }

    // 3) image URL on cards.scryfall.io carries the card's Scryfall id
    const um = blob.match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
    if (um) uuid = um[1].toLowerCase();

    if (!name && !set && !uuid) return null;

    // Alt text is authoritative. Only reach for the API when the name is missing
    // or was derived from a URL slug (which loses apostrophes / casing).
    const needsLookup = !!(set || uuid) && !nameFromAlt;

    return {
      name: name || "",
      key: name ? normKey(name) : (uuid || set + "/" + number),
      set, number, uuid, needsLookup
    };
  }

  function cleanName(s) {
    // "Emeritus of Conflict // Lightning Bolt (Secrets of Strixhaven #113)" -> drop the trailing "(… #…)"
    return s.replace(/\s*\([^()]*#[^()]*\)\s*$/, "").trim();
  }
  function prettySlug(slug) {
    return decodeURIComponent(slug).replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }
  function normKey(name) { return name.toLowerCase().replace(/\s+/g, " ").trim(); }

  async function lookup(parsed) {
    const url = parsed.uuid
      ? `https://api.scryfall.com/cards/${parsed.uuid}`
      : `https://api.scryfall.com/cards/${encodeURIComponent(parsed.set)}/${encodeURIComponent(parsed.number)}`;
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) return null;
      const d = await r.json();
      return d && d.name ? d.name : null;
    } finally { clearTimeout(t); }
  }

  // ---- rendering ----
  function commit() { save(KEY, items); render(); }

  function render() {
    if (!items.length) {
      countEl.textContent = "0 cards";
      listEl.innerHTML = '<div class="empty">Nothing yet — drag some cards over.</div>';
      outEl.value = "";
      return;
    }

    const view = opts.dedupe ? dedup(items) : items.map(it => ({ ...it, n: 1 }));
    countEl.textContent = items.length + (items.length === 1 ? " card" : " cards") +
      (opts.dedupe && view.length !== items.length ? ` · ${view.length} unique` : "");

    listEl.innerHTML = "";
    view.forEach((it, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        `<span class="qty">${opts.dedupe ? "×" + it.n : (i + 1)}</span>` +
        `<span class="nm${it.pending ? " pending" : ""}"></span>` +
        `<button class="x" title="remove">×</button>`;
      row.querySelector(".nm").textContent = it.name;
      row.querySelector(".x").onclick = () => removeOne(it, opts.dedupe);
      listEl.appendChild(row);
    });

    outEl.value = view
      .filter(it => !it.pending)
      .map(it => (opts.dedupe && opts.qty ? it.n + "x " : "") + it.name)
      .join("\n");
  }

  function dedup(list) {
    const map = new Map();
    for (const it of list) {
      const k = it.key || normKey(it.name);
      if (map.has(k)) map.get(k).n++;
      else map.set(k, { ...it, n: 1 });
    }
    return [...map.values()];
  }

  function removeOne(it, wasDeduped) {
    if (wasDeduped) {
      const k = it.key || normKey(it.name);
      const idx = [...items].reverse().findIndex(x => (x.key || normKey(x.name)) === k);
      if (idx >= 0) items.splice(items.length - 1 - idx, 1);
    } else {
      const idx = items.indexOf(it);
      if (idx >= 0) items.splice(idx, 1);
    }
    commit();
  }

  async function copyOut() {
    const text = outEl.value;
    if (!text) { toast("List is empty", true); return; }
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied " + outEl.value.split("\n").length + " lines");
    } catch {
      outEl.focus(); outEl.select();
      toast(document.execCommand("copy") ? "Copied" : "Press ⌘/Ctrl-C", true);
    }
  }

  let toastT;
  function toast(msg, warn) {
    toastEl.textContent = msg;
    toastEl.style.background = warn ? "var(--accent)" : "var(--good)";
    toastEl.style.color = warn ? "#3a2500" : "#062";
    toastEl.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

  render();
})();
</script>
</body>
</html>
